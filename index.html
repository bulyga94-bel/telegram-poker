<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Telegram Poker Club</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #141414;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }
        .table-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 75vw;
            height: 130vw;
            max-width: 310px;
            max-height: 520px;
        }
        .poker-table {
            position: absolute;
            top: 15%;
            left: 5%;
            width: 90%;
            height: 70%;
            background: radial-gradient(circle, #116934 0%, #093c1d 100%);
            border: 8px solid #5a3d28;
            border-radius: 85px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6), inset 0 0 35px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }
        .pot-zone {
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 11px;
            border: 1px solid #ffd700;
        }
        .player-seat {
            position: absolute;
            width: 58px;
            height: 58px;
            background: #222;
            border: 3px solid #555;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 9px;
            z-index: 2;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            cursor: pointer;
            text-align: center;
            box-sizing: border-box;
            padding: 2px;
        }
        /* Стиль для успешного выделения занятого места */
        .player-seat.active { 
            border-color: #00ff66 !important; 
            background: #14351f !important; 
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }
        .player-seat .chips { color: #ffd700; font-weight: bold; font-size: 8px; margin-top: 2px; }
        .player-seat span { max-width: 52px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: bold; }

        .seat-1 { top: 4%; left: 50%; transform: translateX(-50%); } 
        .seat-2 { top: 22%; right: -8%; }
        .seat-3 { top: 50%; right: -16%; transform: translateY(-50%); }
        .seat-4 { bottom: 22%; right: -8%; }
        .seat-5 { bottom: 4%; left: 50%; transform: translateX(-50%); } 
        .seat-6 { bottom: 22%; left: -8%; }
        .seat-7 { top: 50%; left: -16%; transform: translateY(-50%); }
        .seat-8 { top: 22%; left: -8%; }
    </style>
</head>
<body>

    <div class="table-container">
        <div class="poker-table">
            <div class="pot-zone">БАНК: 0<br><span style="color:#ffd700;">10 / 20</span></div>
        </div>

        <div class="player-seat seat-1" id="s1" onclick="takeSeat(1)"><span>Пусто</span></div>
        <div class="player-seat seat-2" id="s2" onclick="takeSeat(2)"><span>Пусто</span></div>
        <div class="player-seat seat-3" id="s3" onclick="takeSeat(3)"><span>Пусто</span></div>
        <div class="player-seat seat-4" id="s4" onclick="takeSeat(4)"><span>Пусто</span></div>
        <div class="player-seat seat-5" id="s5" onclick="takeSeat(5)"><span>Пусто</span></div>
        <div class="player-seat seat-6" id="s6" onclick="takeSeat(6)"><span>Пусто</span></div>
        <div class="player-seat seat-7" id="s7" onclick="takeSeat(7)"><span>Пусто</span></div>
        <div class="player-seat seat-8" id="s8" onclick="takeSeat(8)"><span>Пусто</span></div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        const user = tg.initDataUnsafe?.user;
        const name = user ? user.first_name : "Игрок";
        
        let selectedSeat = null;

        function takeSeat(seatNum) {
            const seat = document.getElementById(`s${seatNum}`);
            
            // Проверяем, свободно ли место
            if (seat.querySelector('span').innerText === "Пусто" || seat.classList.contains('active')) {
                
                // Если до этого уже выбирали другое место — сбрасываем его обратно в "Пусто"
                if (selectedSeat && selectedSeat !== seatNum) {
                    const oldSeat = document.getElementById(`s${selectedSeat}`);
                    oldSeat.classList.remove('active');
                    oldSeat.innerHTML = "<span>Пусто</span>";
                }

                selectedSeat = seatNum;
                
                // Визуально красим текущий стул в зеленый цвет и пишем имя
                seat.classList.add('active');
                seat.innerHTML = `<span>${name}</span><div class="chips">1000 ф.</div>`;
                
                // Активируем системную кнопку Telegram в самом низу экрана для отправки данных
                tg.MainButton.text = `ПОДТВЕРДИТЬ МЕСТО №${seatNum}`;
                tg.MainButton.show();
            }
        }

        // Ловим нажатие на кнопку «ПОДТВЕРДИТЬ МЕСТО» внизу экрана телефона
        tg.onEvent('mainButtonClicked', function(){
            if (selectedSeat) {
                // Передаем данные боту в чат
                tg.sendData(JSON.stringify({action: "join_table", seat: selectedSeat, name: name}));
                tg.MainButton.hide();
                tg.close(); // Автоматически закроем стол после успешного выбора
            }
        });
    </script>
</body>
</html>
