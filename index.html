<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Poker Club</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }
        /* Покерный стол */
        .poker-table {
            width: 90vw;
            max-width: 800px;
            height: 50vw;
            max-height: 450px;
            background: radial-gradient(circle, #0f6330 0%, #08361a 100%);
            border: 15px solid #4a2f13;
            border-radius: 200px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8), inset 0 0 50px rgba(0,0,0,0.6);
            position: relative;
        }
        /* Общий банк в центре */
        .pot-zone {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.4);
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 18px;
            border: 1px solid #ffd700;
        }
        /* Места для 8 игроков по кругу */
        .player-seat {
            position: absolute;
            width: 80px;
            height: 80px;
            background: #2e2e2e;
            border: 3px solid #555;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 11px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }
        .player-seat.active { border-color: #00ff66; }
        .player-seat .chips { color: #ffd700; font-weight: bold; margin-top: 4px; }

        /* Координаты для 8 мест вокруг овального стола */
        .seat-1 { top: -40px; left: 50%; transform: translateX(-50%); }
        .seat-2 { top: 10px; right: 10px; }
        .seat-3 { top: 50%; right: -40px; transform: translateY(-50%); }
        .seat-4 { bottom: 10px; right: 10px; }
        .seat-5 { bottom: -40px; left: 50%; transform: translateX(-50%); }
        .seat-6 { bottom: 10px; left: 10px; }
        .seat-7 { top: 50%; left: -40px; transform: translateY(-50%); }
        .seat-8 { top: 10px; left: 10px; }
    </style>
</head>
<body>

    <div class="poker-table">
        <div class="pot-zone">💰 БАНК: 0</div>

        <!-- 8 мест за столом -->
        <div class="player-seat seat-1 active"><span>Игрок 1</span><div class="chips">1000 🪙</div></div>
        <div class="player-seat seat-2"><span>Пусто</span></div>
        <div class="player-seat seat-3"><span>Пусто</span></div>
        <div class="player-seat seat-4"><span>Пусто</span></div>
        <div class="player-seat seat-5"><span>Пусто</span></div>
        <div class="player-seat seat-6"><span>Пусто</span></div>
        <div class="player-seat seat-7"><span>Пусто</span></div>
        <div class="player-seat seat-8"><span>Пусто</span></div>
    </div>

</body>
</html>
