<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>Telegram Poker Club</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #141414;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            overflow: hidden;
        }
        .table-container {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 75vw;
            height: 130vw;
            max-width: 310px;
            max-height: 520px;
        }
        .poker-table {
            position: absolute;
            top: 15%;
            left: 5%;
            width: 90%;
            height: 70%;
            background: radial-gradient(circle, #116934 0%, #093c1d 100%);
            border: 8px solid #5a3d28;
            border-radius: 85px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6), inset 0 0 35px rgba(0,0,0,0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }
        .pot-zone {
            text-align: center;
            background: rgba(0,0,0,0.7);
            padding: 6px 12px;
            border-radius: 10px;
            font-weight: bold;
            font-size: 11px;
            border: 1px solid #ffd700;
        }
        .player-seat {
            position: absolute;
            width: 58px;
            height: 58px;
            background: #222;
            border: 3px solid #555;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 9px;
            z-index: 2;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
            cursor: pointer;
            text-align: center;
            box-sizing: border-box;
            padding: 2px;
        }
        .player-seat.active { 
            border-color: #00ff66 !important; 
            background: #14351f !important; 
        }
        .player-seat .chips { color: #ffd700; font-weight: bold; font-size: 8px; }

        .seat-1 { top: 4%; left: 50%; transform: translateX(-50%); } 
        .seat-2 { top: 22%; right: -8%; }
        .seat-3 { top: 50%; right: -16%; transform: translateY(-50%); }
        .seat-4 { bottom: 22%; right: -8%; }
        .seat-5 { bottom: 4%; left: 50%; transform: translateX(-50%); } 
        .seat-6 { bottom: 22%; left: -8%; }
        .seat-7 { top: 50%; left: -16%; transform: translateY(-50%); }
        .seat-8 { top: 22%; left: -8%; }
    </style>
</head>
<body>

    <div class="table-container">
        <div class="poker-table">
            <div class="pot-zone">БАНК: 0<br><span style="color:#ffd700;">10 / 20</span></div>
        </div>

        <!-- Передаем нажатие напрямую через простую функцию -->
        <div class="player-seat seat-1" id="s1" onclick="clickSeat(1)"><span>Пусто</span></div>
        <div class="player-seat seat-2" id="s2" onclick="clickSeat(2)"><span>Пусто</span></div>
        <div class="player-seat seat-3" id="s3" onclick="clickSeat(3)"><span>Пусто</span></div>
        <div class="player-seat seat-4" id="s4" onclick="clickSeat(4)"><span>Пусто</span></div>
        <div class="player-seat seat-5" id="s5" onclick="clickSeat(5)"><span>Пусто</span></div>
        <div class="player-seat seat-6" id="s6" onclick="clickSeat(6)"><span>Пусто</span></div>
        <div class="player-seat seat-7" id="s7" onclick="clickSeat(7)"><span>Пусто</span></div>
        <div class="player-seat seat-8" id="s8" onclick="clickSeat(8)"><span>Пусто</span></div>
    </div>

    <script>
        // Инициализация Telegram
        var tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        function clickSeat(seatNum) {
            // ЭТАП 1: Проверяем, работает ли вообще клик на телефоне
            // Телефон должен выдать всплывающее окно
            alert("Вы нажали на стул №" + seatNum);

            // ЭТАП 2: Визуальное изменение стула
            var seat = document.getElementById("s" + seatNum);
            seat.classList.add("active");
            
            var userName = "Игрок";
            if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
                userName = tg.initDataUnsafe.user.first_name;
            }
            
            seat.innerHTML = "<span>" + userName + "</span><div class='chips'>1000 ф.</div>";

            // ЭТАП 3: Отправка данных боту
            try {
                tg.sendData(JSON.stringify({action: "join_table", seat: seatNum, name: userName}));
            } catch(e) {
                alert("Ошибка Telegram: " + e.message);
            }
        }
    </script>
</body>
</html>
